[package]
name = "connect"
version = "0.1.0"
description = "CONNECT — Universal Remote Access, Screen Sharing & Device Control Platform"
edition = "2021"
rust-version = "1.77"

[lib]
name = "connect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "net", "time", "rt-multi-thread", "macros", "sync"] }
rand = "0.8"
sysinfo = "0.30"
log = "0.4"
env_logger = "0.11"
thiserror = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
